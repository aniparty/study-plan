<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💗 七夕快乐</title>
<style>
  :root{
    --bg1:#fff7fa; --bg2:#ffe9f1; --bg3:#ffeef6; --bg4:#fff5f9;
    --card:rgba(255,255,255,.72); --card-border:rgba(255,182,206,.4);
    --primary:#ff6b9d; --primary2:#ff9a76; --gold:#ffb03a; --violet:#c9a7f0;
    --text:#5c3b4e; --muted:#bd90a5; --done:#cbb7c2; --danger:#ff5b7f; --line:rgba(214,142,173,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 800px at 85% -10%, #ffd9e6 0%, transparent 55%),
      radial-gradient(900px 700px at -10% 30%, #ffe3f0 0%, transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3) 75%,var(--bg4));
    background-attachment:fixed;
    color:var(--text); min-height:100vh; padding:32px 16px 70px;
    overflow-x:hidden;
  }

  /* ===== 星空背景 ===== */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .milkyway{
    position:absolute;left:-25%;right:-25%;top:16%;height:48%;
    transform:rotate(-16deg);
    background:radial-gradient(ellipse at center,rgba(255,190,215,.30),rgba(210,185,255,.22) 45%,transparent 72%);
    filter:blur(22px);
  }
  .moon{
    position:absolute;top:6%;right:9%;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fffbe0,#ffe9a8 58%,#f3c37b);
    box-shadow:0 0 44px 12px rgba(255,220,160,.45);
  }
  .cloud{
    position:absolute;border-radius:50%;filter:blur(26px);opacity:.6;
    background:rgba(255,255,255,.7);
  }
  .cloud.c1{width:300px;height:70px;top:12%;left:-60px;}
  .cloud.c2{width:340px;height:80px;top:60%;right:-80px;opacity:.45;}

  /* 流星 */
  .meteor{position:absolute;top:-10%;width:130px;height:2px;border-radius:99px;opacity:0;
    background:linear-gradient(90deg,rgba(255,180,120,0),rgba(255,200,150,.95));
    transform:rotate(-35deg);animation:shoot 7s linear infinite;box-shadow:0 0 6px rgba(255,190,140,.7);}
  .meteor::before{content:"";position:absolute;left:0;top:-1px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,220,170,.9);}
  .m1{left:72%;animation-delay:0s;}
  .m2{left:32%;animation-delay:2.6s;}
  .m3{left:90%;animation-delay:4.8s;animation-duration:9s;}
  @keyframes shoot{
    0%{transform:translate3d(0,0,0) rotate(-35deg);opacity:0;}
    4%{opacity:1;}
    9%{opacity:0;}
    100%{transform:translate3d(-72vw,50vw,0) rotate(-35deg);opacity:0;}
  }

  /* 鹊桥 + 牵牛织女星 */
  .bridge-area{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:min(560px,92%);height:150px;opacity:.9;pointer-events:none;}
  .bridge-svg{position:absolute;inset:0;width:100%;height:100%;}
  .b-path{fill:none;stroke:rgba(255,150,185,.5);stroke-width:2;stroke-dasharray:7 9;}
  .b-path2{fill:none;stroke:rgba(255,205,150,.55);stroke-width:1.6;stroke-dasharray:2 14;stroke-dashoffset:3;}
  .b-star{fill:#ffb03a;filter:drop-shadow(0 0 6px rgba(255,170,50,.95));animation:glow 2.6s ease-in-out infinite;}
  .b-dot{fill:#fff;filter:drop-shadow(0 0 3px rgba(255,150,185,.8));}
  .magpie{position:absolute;font-size:16px;transform:translate(-50%,-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,255,255,.9));}
  .b-lbl{position:absolute;bottom:2px;font-size:11px;font-family:"STKaiti","KaiTi",serif;color:#d46a92;letter-spacing:2px;}
  .lbl-l{left:6%;}
  .lbl-r{right:6%;}
  @keyframes glow{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(0);}50%{transform:translate(-50%,-50%) translateY(-4px);}}

  #stars{position:absolute;inset:0;}
  .star{position:absolute;border-radius:50%;opacity:.8;box-shadow:0 0 6px rgba(255,150,180,.6);animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.75);}50%{opacity:1;transform:scale(1.15);}}
  .heart{position:absolute;bottom:-40px;opacity:0;pointer-events:none;animation:floatUp 13s linear infinite;}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(-10deg);opacity:0;}
    12%{opacity:.7;}
    85%{opacity:.5;}
    100%{transform:translateY(-112vh) rotate(12deg);opacity:0;}
  }

  .app{max-width:600px;margin:0 auto;position:relative;z-index:1;}

  /* ===== 头部 ===== */
  header{text-align:center;}
  header h1{
    font-size:28px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(120deg,#f58ab2,#ff9a76 50%,#b07ee0);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  header .sub{
    margin-top:6px;font-size:13px;color:#d17d9d;letter-spacing:2px;
  }
  header .date{color:var(--muted);font-size:13px;margin-top:8px;}
  .quote{
    margin-top:14px;padding:14px 16px;
    background:linear-gradient(135deg,rgba(255,183,205,.28),rgba(210,185,255,.22));
    border:1px solid rgba(255,150,185,.35);
    border-left:4px solid var(--primary);border-radius:12px;
    font-size:14px;color:#6b4558;line-height:1.65;text-align:left;
    box-shadow:0 4px 24px rgba(255,150,185,.14);
  }
  .quote .q-author{color:var(--muted);font-size:12px;margin-top:4px;text-align:right;}
  .quote .q-greet{font-weight:700;color:#e0608d;margin-bottom:4px;font-size:15px;}

  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:16px;
    padding:18px;margin-top:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 28px rgba(214,142,173,.16);
  }
  .card h2{font-size:15px;font-weight:700;margin-bottom:12px;color:#7a4b60;}

  /* ===== 添加任务 ===== */
  .add-row{display:flex;gap:8px;flex-wrap:wrap;}
  .add-row input[type=text]{flex:1;min-width:180px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none;background:rgba(255,255,255,.8);color:var(--text);}
  .add-row input[type=text]::placeholder{color:#d3a9bb;}
  .add-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,157,.15);}
  .add-row select,.add-row input[type=number]{
    padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;
    background:rgba(255,255,255,.8);color:var(--text);
  }
  .add-row select option{background:#fff;color:#5c3b4e;}
  .add-row input[type=number]{width:86px;}
  .add-row button{
    padding:12px 20px;border:none;border-radius:10px;color:#fff;font-size:15px;cursor:pointer;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 4px 16px rgba(255,107,157,.35);
  }
  .add-row button:hover{opacity:.92;transform:translateY(-1px);}

  /* ===== 统计 ===== */
  .stats{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .progress{flex:1;height:8px;background:rgba(214,142,173,.18);border-radius:99px;overflow:hidden;}
  .progress .bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));width:0;transition:width .3s;box-shadow:0 0 10px rgba(255,176,58,.5);}
  .stats .num{font-size:13px;color:var(--muted);white-space:nowrap;}
  .duration{font-size:13px;color:#9a6f83;margin-top:10px;}

  /* ===== 四象限 ===== */
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .quad .q{
    border-radius:10px;padding:8px 10px;font-size:12px;color:#fff;
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 2px 10px rgba(214,142,173,.25);
  }
  .quad .q span:last-child{font-weight:700;}

  /* ===== 筛选 ===== */
  .filters{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
  .filters button{padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.6);color:var(--muted);cursor:pointer;font-size:12px;}
  .filters button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;color:#fff;}
  .pfilters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pfilters button{padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.6);color:var(--muted);cursor:pointer;font-size:12px;}
  .pfilters button.active{border-width:2px;font-weight:600;color:#e0608d;border-color:var(--primary);}

  /* ===== 任务列表 ===== */
  ul{list-style:none;margin-top:12px;}
  li{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.6);border:1px solid var(--line);}
  li.done .text{text-decoration:line-through;color:var(--done);}
  .check{width:22px;height:22px;border-radius:6px;border:2px solid #e6bccb;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .check.checked{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;box-shadow:0 0 10px rgba(255,107,157,.5);}
  .check.checked::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
  .text{flex:1;font-size:14px;word-break:break-all;}
  .badge{font-size:11px;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap;flex-shrink:0;}
  .mins{font-size:12px;color:var(--muted);flex-shrink:0;}
  .del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;}
  .del:hover{color:var(--danger);}
  .empty{text-align:center;color:var(--muted);padding:28px 0;font-size:14px;}

  /* ===== 热力图 ===== */
  .heat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .heat-head .nav{display:flex;gap:6px;align-items:center;}
  .heat-head .nav button{border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:8px;cursor:pointer;padding:4px 10px;color:#a5798e;}
  .heat-head .title{font-weight:600;font-size:14px;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .weekdays span{font-size:11px;color:var(--muted);text-align:center;}
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .heat-cell{aspect-ratio:1;border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#c78aa5;background:#fff0f4;cursor:default;}
  .heat-cell.today{outline:2px solid var(--primary);}
  .lvl1{background:#ffd9e4;color:#b06b86;}
  .lvl2{background:#ffb6c9;color:#8a3f5c;}
  .lvl3{background:#ff8fb0;color:#fff;}
  .lvl4{background:#ffb03a;color:#fff;box-shadow:0 0 10px rgba(255,176,58,.55);}
  .legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:8px;}
  .legend .sw{width:12px;height:12px;border-radius:3px;}

  /* ===== 成就墙 ===== */
  .ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .ach .a{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:rgba(255,255,255,.55);}
  .ach .a .icon{font-size:24px;filter:drop-shadow(0 0 6px rgba(255,158,203,.4));}
  .ach .a .nm{font-size:12px;font-weight:600;margin-top:4px;color:#7a4b60;}
  .ach .a .ds{font-size:10px;color:var(--muted);margin-top:2px;}
  .ach .a.locked{opacity:.4;filter:grayscale(1);}

  /* ===== 复盘 ===== */
  .reflect-btns{display:flex;gap:8px;}
  .reflect-btns button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.6);cursor:pointer;font-size:14px;color:#a5798e;}
  .reflect-btns button:hover{border-color:var(--primary);color:#e0608d;}

  /* ===== 弹窗 ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(120,60,90,.28);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff8fb;border:1px solid var(--card-border);border-radius:16px;padding:22px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 16px 48px rgba(214,142,173,.35);}
  .modal h3{font-size:17px;margin-bottom:6px;color:#7a4b60;}
  .modal .sub{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .modal label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:#8a5b6f;}
  .modal textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;min-height:70px;resize:vertical;outline:none;font-family:inherit;background:#fff;color:var(--text);}
  .modal textarea:focus{border-color:var(--primary);}
  .modal .m-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
  .modal .m-btns button{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-size:14px;}
  .modal .m-btns .ok{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
  .modal .m-btns .cancel{background:rgba(255,150,185,.14);color:#a5798e;}
  .reflect-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .reflect-item .r-date{font-weight:700;font-size:13px;margin-bottom:6px;color:#e0608d;}
  .reflect-item .r-q{font-size:13px;margin:6px 0 2px;color:#bd90a5;}
  .reflect-item .r-a{font-size:13px;color:#6b4558;white-space:pre-wrap;}

  /* ===== 学习路线图 ===== */
  .rm-root{margin-bottom:16px;}
  .rm-root:last-child{margin-bottom:0;}
  .rm-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;user-select:none;background:rgba(255,150,185,.08);margin-bottom:2px;}
  .rm-head:hover{background:rgba(255,107,157,.14);}
  .rm-arrow{font-size:11px;color:var(--muted);transition:transform .15s;width:12px;display:inline-block;text-align:center;}
  .rm-arrow.open{transform:rotate(90deg);}
  .rm-title{flex:1;font-size:14px;font-weight:600;color:#7a4b60;}
  .rm-head .rm-prog{font-size:12px;color:var(--muted);background:rgba(255,255,255,.7);padding:2px 8px;border-radius:99px;border:1px solid var(--line);}
  .rm-node{margin-top:2px;}
  .rm-leaf{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#8a5b6f;}
  .rm-leaf:hover{background:rgba(255,158,203,.15);}
  .rm-check{width:18px;height:18px;border-radius:5px;border:2px solid #e6bccb;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .rm-check.checked{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;box-shadow:0 0 8px rgba(255,107,157,.5);}
  .rm-check.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700;}
  .rm-leaf.done span:last-child{text-decoration:line-through;color:var(--done);}

  footer{
    text-align:center;margin-top:26px;font-size:13px;color:var(--muted);letter-spacing:1px;
  }
  footer .f-line{font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;color:#e0608d;font-size:15px;}

  /* ===== 彩蛋 ===== */
  #maintitle{user-select:none;cursor:pointer;}
  .greet-banner{
    position:fixed;top:0;left:0;right:0;z-index:90;padding:14px 16px;
    background:linear-gradient(135deg,#ff7eb0,#ff9a76);
    color:#fff;font-size:15px;text-align:center;font-weight:700;letter-spacing:2px;
    box-shadow:0 4px 20px rgba(255,107,157,.4);
    transform:translateY(-100%);transition:transform .6s cubic-bezier(.22,1,.36,1);
  }
  .greet-banner.show{transform:translateY(0);}
  .rain{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden;}
  .rain .drop{position:absolute;top:-60px;animation-name:rainFall;animation-timing-function:linear;animation-fill-mode:forwards;}
  @keyframes rainFall{to{transform:translateY(118vh) rotate(24deg);}}
  .particle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:burstOut .9s ease-out forwards;}
  @keyframes burstOut{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}}
  .moon{cursor:pointer;transition:transform .2s,box-shadow .2s;}
  .moon:hover{transform:scale(1.08);}
  .moon.blink{animation:moonBlink .35s ease;}
  @keyframes moonBlink{0%,100%{transform:scale(1,1);}50%{transform:scale(1,.14);}}
  .zj{position:fixed;z-index:130;pointer-events:none;font-family:"STKaiti","KaiTi","Microsoft YaHei",serif;
    font-size:22px;color:#e0608d;font-weight:700;text-shadow:0 0 12px rgba(255,150,185,.6);
    animation:zjPop 2.2s ease-out forwards;}
  @keyframes zjPop{0%{transform:translateY(0) scale(.4);opacity:0;}18%{transform:translateY(-16px) scale(1.15);opacity:1;}70%{opacity:1;}100%{transform:translateY(-70px) scale(1);opacity:0;}}
  #test-caiden{position:fixed;right:12px;bottom:12px;z-index:99;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,150,185,.4);background:rgba(255,255,255,.5);color:#e0608d;font-size:16px;
    cursor:pointer;opacity:.35;transition:opacity .2s;}
  #test-caiden:hover{opacity:1;}
</style>
</head>
<body>
<div class="greet-banner" id="greet-banner"></div>
<button id="test-caiden" title="彩蛋测试">🎁</button>
<div class="sky">
  <div class="milkyway"></div>
  <div class="moon" id="moon"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="meteor m1"></div>
  <div class="meteor m2"></div>
  <div class="meteor m3"></div>
  <div class="bridge-area">
    <svg class="bridge-svg" viewBox="0 0 640 150" preserveAspectRatio="none">
      <path class="b-path" d="M30,130 Q320,4 610,130"/>
      <path class="b-path2" d="M30,130 Q320,4 610,130"/>
      <circle class="b-star" cx="30" cy="130" r="7"/>
      <circle class="b-star" cx="610" cy="130" r="7"/>
      <circle class="b-dot" cx="160" cy="85" r="2.4"/>
      <circle class="b-dot" cx="320" cy="55" r="2.4"/>
      <circle class="b-dot" cx="480" cy="85" r="2.4"/>
    </svg>
    <span class="magpie" style="left:16%;top:62%">🕊️</span>
    <span class="magpie" style="left:38%;top:28%">🕊️</span>
    <span class="magpie" style="left:58%;top:28%">🕊️</span>
    <span class="magpie" style="left:78%;top:62%">🕊️</span>
    <span class="b-lbl lbl-l">织女星</span>
    <span class="b-lbl lbl-r">牵牛星</span>
  </div>
  <div id="stars"></div>
</div>

<div class="app">
  <header>
    <h1 id="maintitle">💗 七夕快乐</h1>
    <div class="sub">一起变得更好的我们 ❤️</div>
    <div class="date" id="date"></div>
    <div class="quote" id="quote"></div>
  </header>

  <!-- 添加任务 -->
  <div class="card">
    <div class="add-row">
      <input type="text" id="input" placeholder="今天要做什么？回车添加">
      <select id="prio">
        <option value="A">🔥紧急重要</option>
        <option value="B" selected>📌重要不紧急</option>
        <option value="C">⚡紧急不重要</option>
        <option value="D">🗑️不重要不紧急</option>
      </select>
      <input type="number" id="mins" value="30" min="1" title="预估时长(分钟)">
      <button id="add">💗 添加</button>
    </div>

    <div class="stats">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <span class="num" id="num">0 / 0</span>
    </div>
    <div class="duration" id="duration"></div>

    <div class="quad" id="quad"></div>
  </div>

  <!-- 学习路线图 -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <h2 style="margin-bottom:0;">🌠 学习路线图</h2>
      <button id="import-roadmap" style="padding:7px 14px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:13px;cursor:pointer;">💌 一键导入为任务</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">点父项展开/折叠 · 点子项打勾 · 三套计划已预置</div>
    <div id="roadmap"></div>

<script>
  const TASKS_KEY='plan-tasks-v2', LOG_KEY='plan-daily-log-v2', REFLECT_KEY='plan-reflections-v2';
  const OLD_KEY='my-plan-list';

  const PRIORITY={
    A:{label:'🔥紧急重要',color:'#ff6b9d'},
    B:{label:'📌重要不紧急',color:'#c9a7f0'},
    C:{label:'⚡紧急不重要',color:'#f5a623'},
    D:{label:'🗑️不重要不紧急',color:'#b58aa0'},
  };
  const ORDER=['A','B','C','D'];

  // ---- 数据 ----
  let tasks=[], dailyLog={}, reflections={}, roadmapDone={};
  const ROADMAP_KEY='plan-roadmap-v2';

  // 学习路线图（预置计划）
  const ROADMAP=[
    {id:'embed',title:'🔌 嵌入式开发（就业主线）',open:true,children:[
      {id:'embed.c',title:'C 语言基础',children:[
        {id:'embed.c.ptr',title:'指针与数组'},
        {id:'embed.c.struct',title:'结构体与联合体'},
        {id:'embed.c.mem',title:'内存管理（栈/堆/静态区）'},
        {id:'embed.c.bit',title:'位运算与宏'},
      ]},
      {id:'embed.stm32',title:'STM32 外设',children:[
        {id:'embed.gpio',title:'GPIO（点灯/按键）'},
        {id:'embed.uart',title:'串口 UART 通信'},
        {id:'embed.irq',title:'中断与 NVIC'},
        {id:'embed.timer',title:'定时器'},
        {id:'embed.pwm',title:'PWM（呼吸灯/电机）'},
        {id:'embed.adc',title:'ADC 采集'},
        {id:'embed.i2c',title:'I2C / SPI 通信'},
      ]},
      {id:'embed.proj',title:'第一个项目：温湿度监测仪',children:[
        {id:'embed.p1',title:'DHT11 采集温湿度'},
        {id:'embed.p2',title:'OLED 屏幕显示'},
        {id:'embed.p3',title:'串口上传上位机'},
        {id:'embed.p4',title:'自己画 PCB'},
      ]},
      {id:'embed.rtos',title:'FreeRTOS 实时操作系统',children:[
        {id:'embed.f1',title:'任务创建与调度'},
        {id:'embed.f2',title:'队列'},
        {id:'embed.f3',title:'信号量与互斥锁'},
        {id:'embed.f4',title:'内存管理'},
      ]},
      {id:'embed.linux',title:'Linux 嵌入式（进阶）',children:[
        {id:'embed.l1',title:'Linux 基础命令'},
        {id:'embed.l2',title:'C 系统编程'},
        {id:'embed.l3',title:'驱动开发入门'},
      ]},
    ]},
    {id:'english',title:'📖 英语学习',open:true,children:[
      {id:'eng.word',title:'词汇：四级核心词（每日 30 个）'},
      {id:'eng.listen',title:'听力：每日 20 分钟精听'},
      {id:'eng.read',title:'阅读：每日 1 篇真题/外刊'},
      {id:'eng.write',title:'写作/翻译：每周 2 次练习'},
      {id:'eng.cet4',title:'目标：大二过英语四级'},
    ]},
    {id:'major',title:'📚 专业课（大二）',open:true,children:[
      {id:'maj.signal',title:'信号与系统（核心·考研必考）'},
      {id:'maj.analog',title:'模拟电子技术'},
      {id:'maj.digital',title:'数字电子技术'},
      {id:'maj.circuit',title:'电路分析'},
      {id:'maj.math',title:'数学：复变函数 + 概率论'},
    ]},
  ];

  function load(){
    // 迁移旧数据
    if(!localStorage.getItem(TASKS_KEY) && localStorage.getItem(OLD_KEY)){
      try{
        tasks=JSON.parse(localStorage.getItem(OLD_KEY)).map(t=>({
          id:uid(),text:t.text,done:!!t.done,priority:'B',minutes:30,
          createdAt:Date.now(),completedAt:t.done?Date.now():null
        }));
        localStorage.removeItem(OLD_KEY);
      }catch(e){tasks=[];}
    }else{
      tasks=JSON.parse(localStorage.getItem(TASKS_KEY)||'[]');
    }
    dailyLog=JSON.parse(localStorage.getItem(LOG_KEY)||'{}');
    reflections=JSON.parse(localStorage.getItem(REFLECT_KEY)||'{}');
    roadmapDone=JSON.parse(localStorage.getItem(ROADMAP_KEY)||'{}');
  }
  function saveTasks(){localStorage.setItem(TASKS_KEY,JSON.stringify(tasks));}
  function saveLog(){localStorage.setItem(LOG_KEY,JSON.stringify(dailyLog));}
  function saveReflect(){localStorage.setItem(REFLECT_KEY,JSON.stringify(reflections));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  // ---- 日期工具 ----
  function fmtDate(d){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function todayKey(){return fmtDate(new Date());}
  function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
  function monday(){
    const d=new Date();const diff=(d.getDay()===0?-6:1-d.getDay());
    const m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m;
  }

  // ---- 每日打卡记录 ----
  function bumpLog(k,delta){
    dailyLog[k]=(dailyLog[k]||0)+delta;
    if(dailyLog[k]<=0)delete dailyLog[k];
    saveLog();
  }

  // ---- DOM ----
  const $=id=>document.getElementById(id);

  function render(){
    renderStats();
    renderQuad();
    renderRoadmap();
    renderList();
    renderHeat();
    renderAch();
  }

  function renderStats(){
    const total=tasks.length, done=tasks.filter(t=>t.done).length;
    $('num').textContent=`${done} / ${total}`;
    $('bar').style.width=total?(done/total*100)+'%':'0%';
    const tk=todayKey();
    const todayMins=tasks.filter(t=>t.done&&fmtDate(new Date(t.completedAt))===tk).reduce((s,t)=>s+(t.minutes||0),0);
    const mon=monday();
    const weekMins=tasks.filter(t=>t.done&&new Date(t.completedAt)>=mon).reduce((s,t)=>s+(t.minutes||0),0);
    $('duration').textContent=`今日已学 ${todayMins} 分钟 · 本周累计 ${weekMins} 分钟`;
  }

  function renderQuad(){
    const mon=monday();
    const el=$('quad');el.innerHTML='';
    ORDER.forEach(p=>{
      const set=tasks.filter(t=>t.priority===p&&new Date(t.createdAt)>=mon);
      const done=set.filter(t=>t.done).length;
      const pct=set.length?Math.round(done/set.length*100):0;
      const box=document.createElement('div');
      box.className='q';
      box.style.background=PRIORITY[p].color;
      box.innerHTML=`<span>${PRIORITY[p].label}</span><span>${done}/${set.length} (${pct}%)</span>`;
      el.appendChild(box);
    });
  }

  let statusFilter='all', pFilter='all';
  function renderList(){
    const shown=tasks.filter(t=>{
      if(statusFilter==='done'&&!t.done)return false;
      if(statusFilter==='active'&&t.done)return false;
      if(pFilter!=='all'&&t.priority!==pFilter)return false;
      return true;
    }).sort((a,b)=>{
      const pa=ORDER.indexOf(a.priority),pb=ORDER.indexOf(b.priority);
      if(pa!==pb)return pa-pb;
      return a.createdAt-b.createdAt;
    });
    const list=$('list');list.innerHTML='';
    shown.forEach(t=>{
      const i=tasks.indexOf(t);
      const li=document.createElement('li');
      if(t.done)li.className='done';
      li.innerHTML=`
        <div class="check ${t.done?'checked':''}" data-i="${i}"></div>
        <div class="text">${esc(t.text)}</div>
        <span class="badge" style="background:${PRIORITY[t.priority].color}">${PRIORITY[t.priority].label}</span>
        <span class="mins">${t.minutes}min</span>
        <button class="del" data-i="${i}">✕</button>`;
      list.appendChild(li);
    });
    $('empty').style.display=shown.length?'none':'block';
  }

  // ---- 热力图 ----
  let heatMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  function heatLevel(n){return n>=4?4:n>=3?3:n>=2?2:n>=1?1:0;}
  function renderHeat(){
    $('heat-title').textContent=`${heatMonth.getFullYear()}年${heatMonth.getMonth()+1}月`;
    const y=heatMonth.getFullYear(),m=heatMonth.getMonth();
    const first=new Date(y,m,1);
    const offset=(first.getDay()+6)%7;
    const days=new Date(y,m+1,0).getDate();
    const grid=$('heat');grid.innerHTML='';
    for(let i=0;i<offset;i++){grid.appendChild(document.createElement('div'));}
    for(let d=1;d<=days;d++){
      const key=fmtDate(new Date(y,m,d));
      const cnt=dailyLog[key]||0;
      const c=document.createElement('div');
      c.className='heat-cell lvl'+heatLevel(cnt);
      c.textContent=d;
      c.title=`${m+1}月${d}日 · 完成 ${cnt} 个任务`;
      if(key===todayKey())c.classList.add('today');
      grid.appendChild(c);
    }
  }

  // ---- 成就墙 ----
  function longestStreak(dates){
    if(!dates.length)return 0;
    let best=1,cur=1;
    for(let i=1;i<dates.length;i++){
      const gap=Math.round((parseKey(dates[i])-parseKey(dates[i-1]))/86400000);
      cur=(gap===1)?cur+1:1;
      best=Math.max(best,cur);
    }
    return best;
  }
  function renderAch(){
    const done=tasks.filter(t=>t.done);
    const totalDone=done.length;
    const totalMinutes=done.reduce((s,t)=>s+(t.minutes||0),0);
    const days=Object.keys(dailyLog).filter(k=>dailyLog[k]>0).sort();
    const maxStreak=longestStreak(days);
    const maxDay=days.reduce((m,k)=>Math.max(m,dailyLog[k]),0);
    const s={totalDone,totalMinutes,maxStreak,maxDay};
    const ACH=[
      {i:'🌹',n:'一见倾心·小宝宝好厉害呀',d:'完成第一个任务',ok:s.totalDone>=1},
      {i:'💞',n:'心心相印·小宝宝好厉害呀',d:'连续打卡 2 天',ok:s.maxStreak>=2},
      {i:'🔥',n:'小有坚持·小宝宝好厉害呀',d:'连续打卡 3 天',ok:s.maxStreak>=3},
      {i:'📅',n:'一周全勤',d:'连续打卡 7 天',ok:s.maxStreak>=7},
      {i:'🌋',n:'月度王者',d:'连续打卡 30 天',ok:s.maxStreak>=30},
      {i:'📚',n:'十项全能',d:'累计完成 10 个',ok:s.totalDone>=10},
      {i:'📖',n:'五十达成',d:'累计完成 50 个',ok:s.totalDone>=50},
      {i:'🏆',n:'百炼成钢',d:'累计完成 100 个',ok:s.totalDone>=100},
      {i:'💪',n:'小爆发',d:'单日完成 5 个',ok:s.maxDay>=5},
      {i:'🚀',n:'超神之日',d:'单日完成 10 个',ok:s.maxDay>=10},
      {i:'⏱️',n:'十小时',d:'累计学习 10 小时',ok:s.totalMinutes>=600},
      {i:'⏰',n:'五十小时',d:'累计学习 50 小时',ok:s.totalMinutes>=3000},
      {i:'👑',n:'百时大佬·小宝宝好厉害呀',d:'累计学习 100 小时',ok:s.totalMinutes>=6000},
    ];
    const el=$('ach');el.innerHTML='';
    ACH.forEach(a=>{
      const div=document.createElement('div');
      div.className='a'+(a.ok?'':' locked');
      div.innerHTML=`<div class="icon">${a.i}</div><div class="nm">${a.n}</div><div class="ds">${a.d}</div>`;
      el.appendChild(div);
    });
  }

  // ---- 学习路线图 ----
  function countDone(node){
    if(!node.children)return roadmapDone[node.id]?1:0;
    return node.children.reduce((s,c)=>s+countDone(c),0);
  }
  function countTotal(node){
    if(!node.children)return 1;
    return node.children.reduce((s,c)=>s+countTotal(c),0);
  }
  function saveRoadmap(){localStorage.setItem(ROADMAP_KEY,JSON.stringify(roadmapDone));}
  function renderNode(node,level){
    const div=document.createElement('div');
    div.className='rm-node';
    div.style.marginLeft=(level*16)+'px';
    if(node.children){
      const done=countDone(node),total=countTotal(node);
      const head=document.createElement('div');
      head.className='rm-head';
      head.innerHTML=`<span class="rm-arrow ${node.open?'open':''}">▸</span>
        <span class="rm-title">${node.title}</span>
        <span class="rm-prog">${done}/${total}</span>`;
      head.addEventListener('click',()=>{node.open=!node.open;renderRoadmap();});
      div.appendChild(head);
      if(node.open)node.children.forEach(c=>div.appendChild(renderNode(c,level+1)));
    }else{
      const done=!!roadmapDone[node.id];
      const leaf=document.createElement('div');
      leaf.className='rm-leaf'+(done?' done':'');
      leaf.innerHTML=`<span class="rm-check ${done?'checked':''}"></span><span>${esc(node.title)}</span>`;
      leaf.addEventListener('click',()=>{
        roadmapDone[node.id]=!roadmapDone[node.id];
        saveRoadmap();renderRoadmap();
      });
      div.appendChild(leaf);
    }
    return div;
  }
  function renderRoadmap(){
    const el=$('roadmap');
    el.innerHTML='';
    ROADMAP.forEach(root=>{
      const wrap=document.createElement('div');
      wrap.className='rm-root';
      const done=countDone(root),total=countTotal(root);
      const head=document.createElement('div');
      head.className='rm-head';
      head.innerHTML=`<span class="rm-arrow ${root.open?'open':''}">▸</span>
        <span class="rm-title">${root.title}</span>
        <span class="rm-prog">${done}/${total}</span>`;
      head.addEventListener('click',()=>{root.open=!root.open;renderRoadmap();});
      wrap.appendChild(head);
      if(root.open)root.children.forEach(c=>wrap.appendChild(renderNode(c,1)));
      el.appendChild(wrap);
    });
  }
  function importRoadmap(){
    const leaves=[];
    (function walk(nodes){
      nodes.forEach(n=>{
        if(n.children)n.children.forEach(walk);
        else leaves.push(n);
      });
    })(ROADMAP);
    let added=0;
    leaves.forEach(l=>{
      if(tasks.some(t=>t.src===l.id))return;
      tasks.push({id:uid(),text:l.title,done:false,priority:'B',minutes:30,createdAt:Date.now(),completedAt:null,src:l.id});
      added++;
    });
    saveTasks();render();
    if(added===0){alert('已经全部导入过了，没有新增任务。');}
    else{alert(`已导入 ${added} 个任务（默认：重要不紧急 · 30 分钟），可在任务板块里调整。`);}
  }

  // ---- 名言 ----
  const QUOTES=[
    ['两情若是久长时，又岂在朝朝暮暮。','秦观《鹊桥仙》'],
    ['金风玉露一相逢，便胜却人间无数。','秦观《鹊桥仙》'],
    ['纤云弄巧，飞星传恨，银汉迢迢暗度。','秦观《鹊桥仙》'],
    ['愿我如星君如月，夜夜流光相皎洁。','范成大'],
    ['身无彩凤双飞翼，心有灵犀一点通。','李商隐'],
    ['执子之手，与子偕老。','《诗经》'],
    ['在天愿作比翼鸟，在地愿为连理枝。','白居易'],
    ['种一棵树最好的时间是十年前，其次是现在。',''],
    ['你不必等到厉害才开始，但你开始了才会厉害。',''],
    ['所有的坚持，都是因为热爱。',''],
    ['所谓天才，不过是持续的努力。','爱因斯坦'],
    ['今天不想跑，所以才去跑。','村上春树'],
    ['慢慢来，比较快。',''],
    ['你未来的样子，藏在你现在的努力里。',''],
    ['行动是治愈焦虑的良药。',''],
    ['成功的路上并不拥挤，因为坚持的人不多。',''],
    ['每一个不曾起舞的日子，都是对生命的辜负。','尼采'],
    ['路虽远，行则将至；事虽难，做则必成。',''],
    ['把目标刻在心里，把坚持落在每一天。',''],
    ['自律给我自由。',''],
    ['最好的时机是现在。',''],
    ['日拱一卒，功不唐捐。',''],
    ['怕什么真理无穷，进一寸有一寸的欢喜。','胡适'],
    ['千里之行，始于足下。','老子'],
    ['你只管努力，剩下的交给时间。',''],
    ['业精于勤，荒于嬉。','韩愈'],
    ['苟日新，日日新，又日新。','《礼记》'],
    ['纵有疾风起，人生不言弃。',''],
    ['一起努力，顶峰相见。',''],
  ];
  function renderQuote(){
    const start=new Date(new Date().getFullYear(),0,0);
    const doy=Math.floor((new Date()-start)/86400000);
    const q=QUOTES[doy%QUOTES.length];
    $('quote').innerHTML=`<div class="q-greet">梓菁宝宝来啦 ❤️</div>“${q[0]}”${q[1]?`<div class="q-author">—— ${q[1]}</div>`:''}`;
  }

  // ---- 复盘 ----
  function renderReflectSub(){
    $('reflect-sub').textContent=todayKey()+' · 晚 22:00 后会自动提醒';
  }
  function openReflect(){
    const r=reflections[todayKey()];
    $('r-gain').value=r?r.gain:'';
    $('r-diff').value=r?r.diff:'';
    $('r-improve').value=r?r.improve:'';
    $('reflect-modal').classList.add('show');
  }
  function renderHistory(){
    const el=$('history-list');el.innerHTML='';
    const keys=Object.keys(reflections).sort().reverse();
    if(!keys.length){el.innerHTML='<div class="empty">还没有复盘记录</div>';return;}
    keys.forEach(k=>{
      const r=reflections[k];
      const div=document.createElement('div');
      div.className='reflect-item';
      div.innerHTML=`<div class="r-date">${k}</div>
        <div class="r-q">① 学到了什么</div><div class="r-a">${esc(r.gain||'—')}</div>
        <div class="r-q">② 遇到了什么困难</div><div class="r-a">${esc(r.diff||'—')}</div>
        <div class="r-q">③ 明天怎么改进</div><div class="r-a">${esc(r.improve||'—')}</div>`;
      el.appendChild(div);
    });
    $('history-modal').classList.add('show');
  }

  // ---- 事件 ----
  function addTask(){
    const v=$('input').value.trim();
    if(!v)return;
    const mins=Math.max(1,parseInt($('mins').value)||30);
    tasks.unshift({id:uid(),text:v,done:false,priority:$('prio').value,minutes:mins,createdAt:Date.now(),completedAt:null});
    $('input').value='';
    saveTasks();render();
  }
  function toggleTask(i){
    const t=tasks[i];
    if(t.done){bumpLog(fmtDate(new Date(t.completedAt)),-1);t.completedAt=null;t.done=false;}
    else{t.done=true;t.completedAt=Date.now();bumpLog(todayKey(),1);}
    saveTasks();render();
  }
  function delTask(i){
    const t=tasks[i];
    if(t.done)bumpLog(fmtDate(new Date(t.completedAt)),-1);
    tasks.splice(i,1);
    saveTasks();render();
  }

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // ---- 绑定 ----
  $('import-roadmap').addEventListener('click',importRoadmap);
  $('add').addEventListener('click',addTask);
  $('input').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
  $('list').addEventListener('click',e=>{
    const i=e.target.dataset.i;if(i===undefined)return;
    if(e.target.classList.contains('check'))toggleTask(+i);
    else if(e.target.classList.contains('del'))delTask(+i);
  });
  document.querySelector('.filters').addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;
    statusFilter=e.target.dataset.f;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b===e.target));
    renderList();
  });
  document.querySelector('.pfilters').addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;
    pFilter=e.target.dataset.p;
    document.querySelectorAll('.pfilters button').forEach(b=>b.classList.toggle('active',b===e.target));
    renderList();
  });
  $('heat-prev').addEventListener('click',()=>{heatMonth=new Date(heatMonth.getFullYear(),heatMonth.getMonth()-1,1);renderHeat();});
  $('heat-next').addEventListener('click',()=>{heatMonth=new Date(heatMonth.getFullYear(),heatMonth.getMonth()+1,1);renderHeat();});
  $('reflect-now').addEventListener('click',openReflect);
  $('reflect-save').addEventListener('click',()=>{
    reflections[todayKey()]={gain:$('r-gain').value.trim(),diff:$('r-diff').value.trim(),improve:$('r-improve').value.trim(),ts:Date.now()};
    saveReflect();$('reflect-modal').classList.remove('show');
  });
  $('reflect-cancel').addEventListener('click',()=>$('reflect-modal').classList.remove('show'));
  $('reflect-history').addEventListener('click',renderHistory);
  $('history-close').addEventListener('click',()=>$('history-modal').classList.remove('show'));

  // ---- 七夕星空：闪烁星星 + 漂浮爱心 ----
  (function(){
    const sky=document.getElementById('stars');
    const starColors=['#ff9ecb','#ffb3c6','#ffb03a','#c9a7f0'];
    for(let i=0;i<60;i++){
      const s=document.createElement('i');
      const size=(Math.random()*2.5+1).toFixed(1);
      s.className='star';
      s.style.cssText=`left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${size}px;height:${size}px;background:${starColors[(Math.random()*starColors.length)|0]};animation-delay:${(Math.random()*4).toFixed(2)}s;animation-duration:${(2+Math.random()*3).toFixed(2)}s;`;
      sky.appendChild(s);
    }
    const floats=['💖','💕','🌸','✨','💫','🕊️'];
    for(let i=0;i<12;i++){
      const h=document.createElement('i');
      h.className='heart';
      h.textContent=floats[(Math.random()*floats.length)|0];
      h.style.cssText=`left:${(Math.random()*100).toFixed(2)}%;font-size:${(12+Math.random()*16).toFixed(0)}px;animation-delay:${(Math.random()*9).toFixed(2)}s;animation-duration:${(10+Math.random()*12).toFixed(2)}s;`;
      sky.appendChild(h);
    }
  })();

  // ---- 启动 ----
  const week=['日','一','二','三','四','五','六'];
  const n=new Date();
  $('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${week[n.getDay()]}`;

  load();
  renderQuote();
  renderReflectSub();
  render();

  // 晚22点后且今日未复盘，自动弹窗
  if(n.getHours()>=22 && !reflections[todayKey()]){
    setTimeout(openReflect,600);
  }

  // ===== 彩蛋 =====
  const EMOJI=['💖','💗','💕','💘','❤️','🌹','💐','✨'];
  function rand(a,b){return a+Math.random()*(b-a);}
  function spawnRain(n){
    const box=document.createElement('div');
    box.className='rain';
    document.body.appendChild(box);
    for(let i=0;i<n;i++){
      const d=document.createElement('span');
      d.className='drop';
      d.textContent=EMOJI[(Math.random()*EMOJI.length)|0];
      d.style.cssText=`left:${rand(0,100)}%;font-size:${rand(14,34).toFixed(0)}px;animation-duration:${rand(2.4,4.5).toFixed(2)}s;animation-delay:${rand(0,0.8).toFixed(2)}s;`;
      box.appendChild(d);
    }
    setTimeout(()=>box.remove(),5400);
  }
  function spawnBurst(x,y){
    const colors=['#ff6b9d','#ff9a76','#ffb03a','#c9a7f0','#ff8fb0','#ffd166'];
    for(let i=0;i<22;i++){
      const p=document.createElement('i');
      p.className='particle';
      const ang=Math.random()*Math.PI*2, dist=rand(40,140);
      p.style.cssText=`left:${x}px;top:${y}px;background:${colors[(Math.random()*colors.length)|0]};width:${rand(6,12).toFixed(0)}px;height:${rand(6,12).toFixed(0)}px;--dx:${(Math.cos(ang)*dist).toFixed(0)}px;--dy:${(Math.sin(ang)*dist).toFixed(0)}px;animation-duration:${rand(.6,1).toFixed(2)}s;`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),1100);
    }
  }
  function spawnZj(){
    const z=document.createElement('div');
    z.className='zj';
    z.textContent='梓菁宝宝 ❤️';
    z.style.cssText=`left:${rand(15,70)}%;top:${rand(25,60)}%;`;
    document.body.appendChild(z);
    setTimeout(()=>z.remove(),2400);
  }

  // 点击月亮：眨眼 + 掉星星
  $('moon').addEventListener('click',()=>{
    const m=$('moon');
    m.classList.remove('blink');void m.offsetWidth;m.classList.add('blink');
    const r=m.getBoundingClientRect();
    const sc=['#ffb03a','#ff9ecb','#fff'];
    for(let i=0;i<4;i++){
      const s=document.createElement('i');
      s.className='particle';
      s.style.cssText=`left:${r.left+rand(0,r.width)}px;top:${r.top+r.height/2}px;background:${sc[(Math.random()*sc.length)|0]};width:6px;height:6px;--dx:${rand(-28,28).toFixed(0)}px;--dy:${rand(60,140).toFixed(0)}px;animation-duration:${rand(.8,1.4).toFixed(2)}s;`;
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1600);
    }
  });

  // 连点标题 5 次：烟花
  let titleClicks=0, titleTimer=null;
  $('maintitle').addEventListener('click',()=>{
    titleClicks++;
    clearTimeout(titleTimer);
    titleTimer=setTimeout(()=>{titleClicks=0;},1200);
    if(titleClicks>=5){
      titleClicks=0;
      const h=$('maintitle').getBoundingClientRect();
      spawnBurst(h.left+h.width/2,h.top+h.height/2);
      spawnBurst(rand(120,innerWidth-120),rand(120,420));
      spawnBurst(rand(120,innerWidth-120),rand(120,420));
    }
  });

  // 键盘暗号：按 2 → 梓菁宝宝；连按 5-2-0 → 爱心雨
  let keyBuf=[];
  document.addEventListener('keydown',e=>{
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    if(e.key==='2')spawnZj();
    keyBuf.push(e.key);
    if(keyBuf.length>3)keyBuf.shift();
    if(keyBuf.join('')==='520'){spawnRain(60);keyBuf=[];}
  });

  // 测试按钮：手动触发「七夕当天」彩蛋
  $('test-caiden').addEventListener('click',()=>{
    const b=$('greet-banner');
    b.textContent='💗 七夕快乐！梓菁宝宝 ❤️';
    b.classList.add('show');
    spawnRain(70);
  });

  // 七夕当天自动祝福（8月19日 = 2026 七夕）
  const now2=new Date();
  if(now2.getMonth()===7 && (now2.getDate()===18 || now2.getDate()===19)){
    const b=$('greet-banner');
    b.textContent='💗 七夕快乐！梓菁宝宝 ❤️';
    b.classList.add('show');
    setTimeout(()=>spawnRain(70),700);
  }
</script>
</body>
</html>
